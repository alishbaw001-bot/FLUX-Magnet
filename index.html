<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLUX Magnet</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            overflow: hidden;
            background: #030305;
            color: white;
            font-family: Arial, sans-serif;
        }
        canvas{
            position:fixed;
            inset:0;
        }
        .ui{
            position: fixed;
            inset: 0;
            pointer-events: none;
            padding: 28px;
        }
        .logo{
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 5px;
        }
        .logo span{
            color: #8b6cff;
        }
        .info{
            position: absolute;
            bottom: 30px;
            left: 30px;
            color: #666;
            font-size: 10px;
            line-height: 1.8;
            letter-spacing: 2px;
        }
        .status{
            position: absolute;
            top: 30px;
            right: 30px;
            font-size: 10px;
            color: #777;
            letter-spacing: 2px;
        }
        .dot{
            display: inline-block;
            width: 6px;
            height:6px;
            border-radius: 50%;
            background: #8b6cff ;
            box-shadow:0 0 12px  #8b6cff;
            margin-right: 7px;
        }
        .center{
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        h1{
            font-size: clamp(55px,10vw,120px);
            letter-spacing:-7px;
            line-height:.8;
            opacity:.08;
        }
        .center p{
            margin-top: 18px;
            font-size:10px;
            color: #5555;
            letter-spacing: 3px;
        }
    </style>

</head>
<body>
    <script src="app.js"></script>
    <canvas id="canvas"></canvas>
    <div class="ui">
        <div class="logo">
            FLUX <SPan>.</SPan>
        </div>
        <div class="status">
            <span class="dot"></span>
            PARTICLE FIELD / ACTIVE
        </div>
         <div class="center">
            <h1>FLUX</h1>
            <p>MOVE . ATTRACT . CREATE</p>
         </div>
         <div class="info"> 
            MOVE YOUR MOUSE <br>
            CLICK TO CREATE A SHOCKWAVE
         </div>

    </div>
<script>
    
     const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");

        let w, H;
        let particles = [];
        let mouse = {
            x: -1000,
            y: -1000,
        };
        let waves = [];

        function resize(){
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
            particles = [];
                        
            for(let i = 0; i < 360; i++){
                particles.push({
                    x: Math.random() * W,
                    y: Math.random() * H,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5,
                    size: Math.random() * 2 + 0.5,
                    hue: Math.random() * 80 + 220,
                });
            }
        }
        resize();
        window.addEventListener("resize", resize);

        window.addEventListener("mousemove", e => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener("mouseleave", () => {
            mouse.x = -1000;
            mouse.y = -1000;
        });

        window.addEventListener("click", e => {
            waves.push({
                x: e.clientX,
                y: e.clientY,
                r: 5,
                life: 1
            });
        });

        function animate(){
            ctx.fillStyle = "rgba(3, 3, 5, 0.25)";
            ctx.fillRect(0, 0, W, H);

            particles.forEach(p => {
                let dx = mouse.x - p.x;
                let dy = mouse.y - p.y;
                let distance = Math.sqrt(dx * dx + dy * dy);
                
                if(distance < 320 && distance > 0){
                    let force = (320 - distance) / 320;
                    p.vx += (dx / distance) * force * 0.35;
                    p.vy += (dy / distance) * force * 0.35;
                }

                p.vx *= 0.95;
                p.vy *= 0.95;

                p.x += p.vx;
                p.y += p.vy;

                if(p.x < 0) p.x = W;
                if(p.x > W) p.x = 0;
                if(p.y < 0) p.y = H;
                if(p.y > H) p.y = 0;

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                
                ctx.fillStyle = `hsla(${p.hue}, 96%, 70%, 0.8)`;
                ctx.shadowBlur = 12;
                ctx.shadowColor = `hsla(${p.hue}, 96%, 70%, 0.8)`;
                ctx.fill();
            });

            ctx.shadowBlur = 0;

            // CONNECT NEAR PARTICLES
            for(let i = 0; i < particles.length; i++){
                for(let j = i + 1; j < particles.length; j++){
                    let a = particles[i];
                    let b = particles[j];

                    let dx = a.x - b.x;
                    let dy = a.y - b.y;
                    let d = Math.sqrt(dx * dx + dy * dy);

                    if(d < 75){
                        ctx.beginPath();
                        ctx.moveTo(a.x, a.y);
                        ctx.lineTo(b.x, b.y);
                        ctx.strokeStyle = `rgba(139, 108, 255, ${0.12 * (1 - d / 75)})`;
                        ctx.stroke();
                    }
                }
            }

            // SHOCKWAVES
            waves.forEach((w, i) => {
                w.r += 5;
                w.life -= 0.025;

                ctx.beginPath();
                ctx.arc(w.x, w.y, w.r, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(139, 108, 255, ${Math.max(0, w.life)})`;
                ctx.lineWidth = 2;
                ctx.stroke();

                particles.forEach(p => {
                    let dx = p.x - w.x;
                    let dy = p.y - w.y;
                    let d = Math.sqrt(dx * dx + dy * dy);

                    if(d > w.r - 15 && d < w.r + 15 && d > 0){
                        p.vx += (dx / d) * 3;
                        p.vy += (dy / d) * 3;
                    }
                });

                if(w.life <= 0){
                    waves.splice(i, 1);
                }
            });

            requestAnimationFrame(animate);
        }

        animate();



</script>

        
    
</body>
</html>
